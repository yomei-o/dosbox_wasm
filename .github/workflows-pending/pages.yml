name: Deploy to GitHub Pages

# The built .wasm/.js live in web/ and are committed, so publishing is just a
# static upload of the repository root. Set Settings -> Pages -> Source to
# "GitHub Actions" for this to take effect.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Drop files that do not need publishing
        run: rm -rf .git .github src scripts patches

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
